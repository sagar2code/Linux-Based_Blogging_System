services:
  users:
    build:
      context: .
      dockerfile: Dockerfile.users
    ports:
      - "2222:22"
    volumes:
      - home_data:/home
      - storage_data:/storage
    networks:
      - backend
      - frontend
    env_file:
      - .env
    depends_on:	
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 100

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    env_file:
      - .env
    volumes:
      - home_data:/home:ro
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 200

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - users
    volumes:
      - home_data:/home:ro
      - ./update_scripts:/update_scripts
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
          pids: 50

volumes:
  home_data:
  db_data:
  storage_data:

networks:
  backend:
  frontend:
